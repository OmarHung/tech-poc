[package]
name = "checkout-queue"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
futures-util = "0.3.34"
getrandom = "0.3.4"
rlimit = "0.10.2"
redis = { version = "1.8.1", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
libtest-mimic = "0.8.2"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false
